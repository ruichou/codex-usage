name: Build and release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    name: Windows executable
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install build tools
        run: python -m pip install --upgrade pyinstaller
      - name: Build executable
        run: python -m PyInstaller --noconfirm --clean --onefile --windowed --icon assets/codex-usage.ico --name CodexUsageWidget usage_widget.py
      - name: Rename artifact
        shell: pwsh
        run: Move-Item dist/CodexUsageWidget.exe dist/CodexUsageWidget-Windows.exe
      - uses: actions/upload-artifact@v4
        with:
          name: CodexUsageWidget-Windows
          path: dist/CodexUsageWidget-Windows.exe

  macos:
    name: macOS app (${{ matrix.arch }})
    strategy:
      matrix:
        include:
          - runner: macos-13
            arch: intel
          - runner: macos-14
            arch: apple-silicon
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install build tools
        run: python -m pip install --upgrade pyinstaller
      - name: Build app
        run: python -m PyInstaller --noconfirm --clean --windowed --icon assets/codex-usage.icns --name CodexUsageWidget usage_widget.py
      - name: Package app
        run: ditto -c -k --sequesterRsrc --keepParent dist/CodexUsageWidget.app dist/CodexUsageWidget-macOS-${{ matrix.arch }}.zip
      - uses: actions/upload-artifact@v4
        with:
          name: CodexUsageWidget-macOS-${{ matrix.arch }}
          path: dist/CodexUsageWidget-macOS-${{ matrix.arch }}.zip

  release:
    name: Publish release assets
    needs: [windows, macos]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: release-assets/*
          generate_release_notes: true
